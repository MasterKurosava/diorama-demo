<div class="ej-feed">
  <p class="ej-note">Reactions from other viewers float up from the bar.</p>
  <div class="ej-picks" data-dio="emoji" data-dio-trigger="event" data-dio-event="reaction" data-dio-emoji="👍 ❤️ 😂 😮" data-dio-count="3" data-dio-spread="60">
    <button type="button" data-react="👍" aria-label="Thumbs up">👍</button>
    <button type="button" data-react="❤️" aria-label="Love">❤️</button>
    <button type="button" data-react="😂" aria-label="Laughing">😂</button>
    <button type="button" data-react="😮" aria-label="Surprised">😮</button>
  </div>
</div>
