<figure data-dio="hotspots" style="position: relative; margin: 0; background: radial-gradient(110% 90% at 50% 30%, #f7f3ec, #e2dbcd)">
  <div data-dio="model" data-dio-src="/media/camera/camera.glb" data-dio-yaw="-30" data-dio-pitch="16" data-dio-scale="0.8" data-dio-drag="false" style="position: absolute; inset: 0">
    <img src="/media/camera/camera.webp" alt="" width="900" height="600" style="width: 100%; height: 100%; object-fit: contain" />
  </div>
  <span data-dio-at="Shutter dial" style="border-radius: 999px; padding: 2px 8px; background: #fff; color: #1d1e22; font: 500 12px system-ui; box-shadow: 0 2px 8px rgb(0 0 0 / 0.15)">Shutter dial</span>
  <span data-dio-at="Front ring" data-dio-normal="0 0 1" style="border-radius: 999px; padding: 2px 8px; background: #fff; color: #1d1e22; font: 500 12px system-ui; box-shadow: 0 2px 8px rgb(0 0 0 / 0.15)">Lens</span>
</figure>
