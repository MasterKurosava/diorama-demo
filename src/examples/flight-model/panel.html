<label>progress <input class="progress" type="range" min="0" max="1" step="0.01" value="0.3" /> <output class="progress-value">0.30</output></label>
<label>duration <input class="duration" type="range" min="0.2" max="2" step="0.05" value="0.8" /> <output class="duration-value">0.80</output> s</label>
<label>takeover from <input class="from" type="range" min="0" max="1" step="0.01" value="0.15" /> <output class="from-value">0.15</output></label>
<label>to <input class="to" type="range" min="0" max="1" step="0.01" value="0.5" /> <output class="to-value">0.50</output></label>
<button class="play" type="button">Play the model</button>
<button class="real" type="button">Play a real flight</button>
